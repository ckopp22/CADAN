<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Knight helmet outline with plume and visor slit -->
  <path d="M28 92 V42 C28 26 38 16 50 16 C62 16 72 26 72 42 V92 Z"
        fill="none" stroke="#3b2a1a" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Plume -->
  <path d="M50 16 C48 6 62 3 72 11 C64 10 58 12 54 17"
        fill="none" stroke="#3b2a1a" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Visor slit -->
  <rect x="35" y="34" width="30" height="8" rx="4"
        fill="none" stroke="#3b2a1a" stroke-width="3"/>
  <!-- Number goes here: change the text, or set it from JavaScript -->
  <text id="knight-number" x="50" y="78" text-anchor="middle"
        font-family="Georgia, serif" font-size="26" font-weight="bold"
        fill="#3b2a1a">2</text>
</svg>
